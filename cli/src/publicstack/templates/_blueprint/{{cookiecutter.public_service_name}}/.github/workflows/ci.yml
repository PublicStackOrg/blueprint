name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  POETRY_VERSION: "2.2.1"
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.27.4"

jobs:
  python:
    name: Python lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      SYNC_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      AUTH_MODE: none
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - name: Install workspace deps
        run: poetry install --no-interaction --no-root
      - name: Install migrator (separate Poetry env)
        run: poetry install --no-interaction --no-root
        working-directory: services/migrator
      - name: Run migrations
        run: poetry run alembic upgrade head
        working-directory: services/migrator
      - name: Lint
        run: poetry run ruff check libraries services
      - name: Test (libraries)
        run: poetry run pytest libraries
      - name: Test (services)
        run: poetry run pytest services

  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: ui — pub get + analyze + test
        working-directory: libraries/ui
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: resident — pub get + analyze + test
        working-directory: apps/resident
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: staff — pub get + analyze + test
        working-directory: apps/staff
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: kiosk — pub get + analyze + test
        working-directory: apps/kiosk
        run: |
          flutter pub get
          flutter analyze
          flutter test

  flutter-web-build:
    name: Flutter web builds
    runs-on: ubuntu-latest
    needs: [flutter]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build resident web
        working-directory: apps/resident
        run: |
          flutter pub get
          flutter build web --release
      - name: Build staff web
        working-directory: apps/staff
        run: |
          flutter pub get
          flutter build web --release
      - name: Build kiosk web
        working-directory: apps/kiosk
        run: |
          flutter pub get
          flutter build web --release

  docker-build:
    name: Build service images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: false
          tags: api:dev
      - name: Build worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/worker/Dockerfile
          push: false
          tags: worker:dev
      - name: Build migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/migrator/Dockerfile
          push: false
          tags: migrator:dev

  guards:
    name: CI guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no-silent-catch
        run: bash tools/no-silent-catch-check.sh
