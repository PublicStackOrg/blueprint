[tool.poetry]
name = "{{ cookiecutter.python_package }}"
version = "0.0.1"
description = "{{ cookiecutter.description }}"
authors = ["PublicStack <hello@publicstack.org>"]
license = "AGPL-3.0-or-later"
readme = "README.md"
package-mode = false

# --- Workspace path deps ----------------------------------------------------
# Each service and shared library is a Poetry package. Path deps with
# develop=true keep them all editable from the workspace root.

[tool.poetry.dependencies]
python = "^3.13"

[tool.poetry.dependencies.api]
path = "services/api"
develop = true

[tool.poetry.dependencies.worker]
path = "services/worker"
develop = true

# `migrator` is intentionally NOT a workspace path-dep. It uses
# `package-mode = false` (Alembic + a migrations/ tree, no importable
# package), so Poetry can't editable-install it from this workspace.
# Install it separately with `cd services/migrator && poetry install`
# when you need to run migrations.

[tool.poetry.dependencies.core]
path = "libraries/core"
develop = true

[tool.poetry.dependencies.grid_adapters]
path = "libraries/grid_adapters"
develop = true

[tool.poetry.dependencies.test_helper]
path = "libraries/test_helper"
develop = true

# --- Dev tooling ------------------------------------------------------------

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
ruff = "^0.7.0"
httpx = "^0.27.0"

# --- Tooling config ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",  # line length — formatter handles wrapping
    "B008",  # FastAPI's Depends-in-default-arg is the canonical pattern
    "N818",  # APIException is a base class; Error suffix doesn't fit
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["services", "libraries", "tests"]
python_files = ["test_*.py", "*_test.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
