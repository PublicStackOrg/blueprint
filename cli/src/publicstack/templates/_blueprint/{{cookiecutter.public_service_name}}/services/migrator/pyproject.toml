[tool.poetry]
name = "migrator"
version = "0.0.1"
description = "{{ cookiecutter.public_service_name }} database migrator (Alembic)."
authors = ["PublicStack <hello@publicstack.org>"]
license = "AGPL-3.0-or-later"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
alembic = "^1.14.0"
sqlalchemy = { version = "^2.0.36", extras = ["asyncio"] }
psycopg2-binary = "^2.9.9"
asyncpg = "^0.30.0"
pydantic-settings = "^2.7.0"
core = { path = "../../libraries/core", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
