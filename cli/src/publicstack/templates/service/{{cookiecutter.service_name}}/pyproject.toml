[tool.poetry]
name = "{{ cookiecutter.service_name }}"
version = "0.0.1"
description = "Internal service: {{ cookiecutter.service_name }}"
authors = ["PublicStack <hello@publicstack.org>"]
license = "AGPL-3.0-or-later"
readme = "README.md"
packages = [{ include = "{{ cookiecutter.python_package }}" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic = "^2.9.0"
pydantic-settings = "^2.5.0"

[tool.poetry.dependencies.core]
path = "../../libraries/core"
develop = true

[tool.poetry.dependencies.grid_adapters]
path = "../../libraries/grid_adapters"
develop = true

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
