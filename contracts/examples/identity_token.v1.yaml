$schema: https://json-schema.org/draft/2020-12/schema
$id: https://contracts.publicstack.org/identity_token.v1.json
title: identity_token
description: |
  Token claims that every Grid identity adapter must surface. Adapters
  for Keycloak, ZITADEL, Authentik, Auth0, Clerk, Cognito, etc. all
  normalize their provider-specific claims into this shape before
  handing them to a Public Service.

  Public Services depend on the contract, not the provider. See
  blueprint/grid/identity/README.md.
x-publicstack-contract-name: identity_token
x-publicstack-contract-version: v1

type: object
required:
  - sub
  - auth_source
properties:
  sub:
    type: string
    description: |
      Stable subject identifier. Opaque to the Public Service; the identity
      provider owns its meaning.
  email:
    type: string
    format: email
    description: Primary email address. Optional — kiosk and machine identities may not have one.
  email_verified:
    type: boolean
    description: True if the identity provider verified the email address.
    default: false
  display_name:
    type: string
    description: Human-readable name for UI presentation. Optional.
  is_staff:
    type: boolean
    description: |
      True if this identity is a city-staff actor (vs a resident or service).
      Public Services use this for staff-only routes and audit categorization.
    default: false
  roles:
    type: array
    description: |
      Coarse role labels assigned by the identity provider. Public Services
      should treat unknown roles as "no permission" rather than failing.
    items:
      type: string
      pattern: '^[a-z][a-z0-9_-]*$'
    default: []
  auth_source:
    type: string
    enum: [city-sso, resident, service, dev]
    description: |
      Where this identity came from. `city-sso` for staff via SSO,
      `resident` for self-registered residents, `service` for machine
      identities, `dev` for the no-auth dev adapter.
  expires_at:
    type: string
    format: date-time
    description: When the token stops being trustworthy. Optional for non-bearer flows.
additionalProperties: true
