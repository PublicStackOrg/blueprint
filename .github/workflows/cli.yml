name: cli

on:
  pull_request:
    paths:
      - "cli/**"
      - "template/**"
      - ".github/workflows/cli.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "template/**"
      - ".github/workflows/cli.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry==1.8.3
      - name: Verify bundled blueprint template is in sync
        run: python tools/sync_blueprint_template.py --check
      - name: Install dependencies
        run: poetry install --with dev
      - name: Lint
        run: poetry run ruff check src tests
      - name: Test
        run: poetry run pytest -q

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pipx
        run: python -m pip install --upgrade pipx
      - name: Install publicstack CLI
        run: pipx install ./cli
      - name: Install publicstack-contracts CLI
        run: pipx install ./contracts/tooling
      - name: Generate a Public Service
        run: |
          mkdir -p "${RUNNER_TEMP}/out"
          publicstack new service tmp --output-dir "${RUNNER_TEMP}/out"
      - name: Verify generated tree
        run: |
          test -f "${RUNNER_TEMP}/out/tmp/services/api/pyproject.toml"
          test -f "${RUNNER_TEMP}/out/tmp/apps/resident/pubspec.yaml"
          test -f "${RUNNER_TEMP}/out/tmp/docker-compose.yml"
          test -f "${RUNNER_TEMP}/out/tmp/grid/identity.yaml"
          test -f "${RUNNER_TEMP}/out/tmp/grid/audit.yaml"
      - name: Exercise add contract + grid + validate + diff
        working-directory: ${{ runner.temp }}/out/tmp
        run: |
          publicstack add contract citations --version v1 --exposes
          publicstack-contracts validate contracts/exposed/citations.v1.yaml
          publicstack add grid identity   # idempotent on a fresh PS
          publicstack add grid audit      # ditto
      - name: Validate Grid contracts ship valid
        run: |
          for f in blueprint/grid/*/contract.yaml; do
            publicstack-contracts validate "$f"
          done
