[tool.poetry]
name = "worker"
version = "0.0.1"
description = "{{ cookiecutter.public_service_name }} background task worker (RQ)."
authors = ["PublicStack <hello@publicstack.org>"]
license = "AGPL-3.0-or-later"
package-mode = true
packages = [{ include = "worker" }]

[tool.poetry.dependencies]
python = "^3.13"
rq = "^2.0.0"
redis = "^5.2.0"
core = { path = "../../libraries/core", develop = true }
grid_adapters = { path = "../../libraries/grid_adapters", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
fakeredis = "^2.26.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
