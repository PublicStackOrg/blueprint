[tool.poetry]
name = "api"
version = "0.0.1"
description = "{{ cookiecutter.public_service_name }} HTTP API."
authors = ["PublicStack <hello@publicstack.org>"]
license = "AGPL-3.0-or-later"
package-mode = true
packages = [{ include = "api" }]

[tool.poetry.dependencies]
python = "^3.13"
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }
pydantic = "^2.10.0"
pydantic-settings = "^2.7.0"
prometheus-fastapi-instrumentator = "^7.0.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-exporter-otlp = "^1.27.0"
python-json-logger = "^2.0.7"
core = { path = "../../libraries/core", develop = true }
grid_adapters = { path = "../../libraries/grid_adapters", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"
test_helper = { path = "../../libraries/test_helper", develop = true }

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
