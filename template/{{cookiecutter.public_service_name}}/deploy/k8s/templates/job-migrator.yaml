apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrator
  labels:
    {{- include "ps.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrator
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrator
          image: "{{ .Values.imagePrefix }}-migrator:{{ .Values.imageTag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ .Release.Name }}-env
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ if .Values.externalPostgres.enabled }}{{ .Values.externalPostgres.secretName }}{{ else }}{{ .Values.postgresql.auth.existingSecret }}{{ end }}
                  key: password
            - name: DATABASE_URL
              value: {{ include "ps.databaseUrl" . | quote }}
          resources:
            {{- toYaml .Values.migrator.resources | nindent 12 }}
