apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-env
  labels:
    {{- include "ps.labels" . | nindent 4 }}
data:
  ENVIRONMENT: prod
  LOG_LEVEL: {{ .Values.observability.logLevel | quote }}
  AUTH_MODE: {{ .Values.grid.authMode | quote }}
  AUDIT_BACKEND: {{ .Values.grid.auditBackend | quote }}
  DOCUMENT_STORAGE_BACKEND: {{ .Values.grid.documentStorageBackend | quote }}
  DOCUMENT_STORAGE_LOCAL_ROOT: {{ .Values.grid.documentStorageLocalRoot | quote }}
  NOTIFICATIONS_BACKEND: {{ .Values.grid.notificationsBackend | quote }}
  PAYMENTS_BACKEND: {{ .Values.grid.paymentsBackend | quote }}
  ACCESSIBILITY_BACKEND: {{ .Values.grid.accessibilityBackend | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.observability.otelExporterOtlpEndpoint | quote }}
  OTEL_SDK_DISABLED: {{ .Values.observability.otelSdkDisabled | quote }}
  CORS_ORIGINS: {{ default (printf "https://%s" .Values.publicHostname) .Values.corsOrigins | quote }}
