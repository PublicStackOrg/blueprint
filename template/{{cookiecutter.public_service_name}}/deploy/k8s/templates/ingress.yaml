{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "ps.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.publicHostname }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.publicHostname }}
      http:
        paths:
          - path: {{ .Values.ingress.pathPrefixes.api }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8000
          - path: {{ .Values.ingress.pathPrefixes.v1 }}
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8000
          - path: /version
            pathType: Exact
            backend:
              service:
                name: {{ .Release.Name }}-api
                port:
                  number: 8000
{{- end }}
