apiVersion: v2
name: {{ cookiecutter.python_package }}
description: |
  {{ cookiecutter.public_service_name }} — PublicStack Helm chart.
  Cloud-agnostic K8s deployment for the api / worker / migrator services.
  Bring-your-own Postgres + Redis or enable the Bitnami subcharts.
type: application
version: 0.1.0
appVersion: "0.0.1"

dependencies:
  - name: postgresql
    version: "16.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: postgresql.enabled
  - name: redis
    version: "20.x.x"
    repository: "https://charts.bitnami.com/bitnami"
    condition: redis.enabled

maintainers:
  - name: PublicStack
    email: hello@publicstack.org
    url: https://github.com/{{ cookiecutter.github_org }}
